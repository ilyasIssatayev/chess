[package]
name = "chess-camera-recorder"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]
resolver = "3"
members = [
    ".",
    "crates/contracts",
    "crates/capture-probe",
    "crates/chess-core",
    "crates/evaluation",
    "crates/recorder-core",
    "crates/storage",
    "crates/export",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1.0.100"
cozy-chess = "0.3.4"
nokhwa = { version = "=0.10.11", default-features = false, features = ["decoding", "input-avfoundation"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
uuid = { version = "1.26.1", features = ["serde", "v7"] }

[dependencies]
anyhow.workspace = true
chess-core = { path = "crates/chess-core" }
contracts = { path = "crates/contracts" }
export = { path = "crates/export" }
recorder-core = { path = "crates/recorder-core" }
storage = { path = "crates/storage" }
